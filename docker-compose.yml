name: gestionale-gv

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestionale-gv-backend
    working_dir: /workspace
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/Rome
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-${SUPABASE_DB_JDBC_URL}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${SUPABASE_DB_USER}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${SUPABASE_DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend:/workspace
      - maven-repository:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/api/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestionale-gv-frontend
    working_dir: /workspace
    command: sh -c "if [ ! -d node_modules/.bin ]; then npm install; fi; npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Rome
      BACKEND_URL: http://backend:8080
      # Usato dal browser se si vuole chiamare direttamente l'URL esposto dal backend:
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  maven-repository:
  frontend-node-modules:

networks:
  app-network:
    driver: bridge
