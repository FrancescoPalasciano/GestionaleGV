spring:
  application:
    name: gestionale-gv-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:${SUPABASE_DB_JDBC_URL:***REMOVED***}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:***REMOVED***}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:***REMOVED***}}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET:***REMOVED***}
    jwt-expiration-ms: 86400000
